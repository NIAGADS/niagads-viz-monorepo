# Builds all packages and publishes canary versions to npm

name: Canary Release

on:
  pull_request:
    branches:
      - main
    types: 
      - closed

permissions:
  id-token: write # for OIDC for npm trusted publishers
  contents: read

jobs:
  publish-canary:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Create synthetic PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          SYNTHETIC_SHA=$(
            git commit-tree HEAD^{tree} \
              -p "$BASE_SHA" \
              -m "Temporary canary commit for PR #${{ github.event.pull_request.number }}"
          )
          git checkout --detach "$SYNTHETIC_SHA"
      - name: Install dependencies
        run: npm ci
      - name: Build packages 
        run: npm run build
      - name: Publish canary
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: npx lerna publish --canary --yes --dist-tag canary
